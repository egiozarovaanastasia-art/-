
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Периодическая система | Sci-Fi Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Syncopate:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #050a14;
    --bg-panel: #0a1428;
    --accent: #00EAFF;
    --accent-glow: rgba(0, 234, 255, 0.4);
    --text: #e0f0ff;
    --text-muted: #5a7a9a;
    --card-bg: #0f1c35;
    --border: #1c3a6b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body { 
    font-family: 'Roboto Condensed', sans-serif;
    background-color: var(--bg-dark); color: var(--text); min-height: 100vh; 
    display: flex; flex-direction: column; overflow-x: hidden;
    background-image: 
      linear-gradient(rgba(0, 234, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 234, 255, 0.03) 1px, transparent 1px),
      radial-gradient(circle at 50% 0%, #0a1e3d 0%, var(--bg-dark) 70%);
    background-size: 30px 30px, 30px 30px, 100% 100%;
  }

  header { 
    text-align: center; padding: 15px 10px; border-bottom: 1px solid var(--border);
    background: rgba(5, 10, 20, 0.8); box-shadow: 0 5px 20px rgba(0,0,0,0.5);
  }
  h1 { 
    font-family: 'Syncopate', sans-serif; font-size: 1.5rem; font-weight: 700; 
    letter-spacing: 2px; color: #fff; margin-bottom: 5px; text-shadow: 0 0 10px var(--accent);
  }
  p { color: var(--text-muted); font-size: 0.9rem; letter-spacing: 1px;}

  /* Контейнер таблицы */
  .table-container { 
    flex-grow: 1; display: flex; justify-content: center; align-items: flex-start; 
    padding: 10px; overflow: auto; 
  }

  /* --- ВЕРСИЯ ДЛЯ ТЕЛЕФОНА (СПИСОК) --- */
  .mobile-list {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 600px;
    gap: 10px;
  }
  .mobile-item {
    display: flex;
    align-items: center;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 15px;
    cursor: pointer;
    transition: 0.2s;
  }
  .mobile-item:hover {
    border-color: var(--accent);
    box-shadow: 0 0 15px var(--accent-glow);
    background: #102445;
  }
  .mobile-item .num {
    font-size: 0.8rem; color: var(--text-muted); width: 30px;
  }
  .mobile-item .sym {
    font-size: 1.5rem; font-weight: 700; width: 50px; text-shadow: 0 0 5px var(--el-color);
  }
  .mobile-item .name {
    font-size: 1.1rem; font-weight: 700; flex-grow: 1;
  }
  .mobile-item .arrow {
    color: var(--accent); font-size: 1.2rem;
  }

  /* --- ВЕРСИЯ ДЛЯ КОМПЬЮТЕРА (СЕТКА) --- */
  .desktop-table {
    display: none; /* Скрыто на телефоне */
    grid-template-columns: repeat(18, 55px);
    grid-template-rows: repeat(7, 65px);
    gap: 4px;
  }
  .element {
    background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 4px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    cursor: pointer; transition: all 0.15s; position: relative; user-select: none;
  }
  .element:hover { 
    transform: scale(1.2); z-index: 10; border-color: var(--accent); 
    box-shadow: 0 0 15px var(--accent-glow); background-color: #102445; 
  }
  .element .symbol { font-size: 1.2rem; font-weight: 700; color: #fff; text-shadow: 0 0 3px var(--el-color);}
  .element .number { position: absolute; top: 4px; left: 6px; font-size: 0.65rem; color: var(--text-muted); }

  /* --- МОДАЛЬНОЕ ОКНО --- */
  #modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(5, 10, 20, 0.9); z-index: 50; display: none; justify-content: center; align-items: center;
    opacity: 0; transition: opacity 0.3s;
  }
  #modal-overlay.active { display: flex; opacity: 1; }

  .element-modal {
    background: var(--bg-panel); border: 2px solid var(--accent);
    border-radius: 10px; width: 90%; max-width: 450px; padding: 20px;
    box-shadow: 0 0 30px var(--accent-glow); position: relative;
  }
  .close-modal {
    position: absolute; top: 10px; right: 15px; font-size: 2rem;
    color: var(--text-muted); cursor: pointer;
  }
  .close-modal:hover { color: var(--accent); }

  .modal-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 15px;}
  .modal-symbol { font-size: 3rem; font-weight: 700; color: var(--accent); text-shadow: 0 0 20px var(--accent-glow); line-height: 1;}
  .modal-title h2 { font-family: 'Syncopate', sans-serif; font-size: 1.2rem; color: #fff; }
  .modal-title p { font-size: 0.9rem; color: var(--text-muted);}

  .modal-info { display: flex; gap: 10px; margin-bottom: 15px; }
  .info-box { background: rgba(0, 234, 255, 0.05); border: 1px solid var(--border); padding: 8px; border-radius: 5px; flex: 1; text-align: center;}
  .info-box span { display: block; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;}
  .info-box strong { font-size: 1.2rem; color: #fff; }

  .modal-desc { line-height: 1.5; color: #b0d0f0; font-size: 1rem; margin-bottom: 15px;}

  .btn-synth {
    width: 100%; background: transparent; color: var(--accent); border: 2px solid var(--accent);
    padding: 10px; border-radius: 5px; font-family: 'Syncopate', sans-serif; font-weight: 700; cursor: pointer;
    transition: 0.2s;
  }
  .btn-synth:hover { background: var(--accent); color: #000; }

  /* --- ЛАБОРАТОРИЯ --- */
  .lab-panel {
    background: var(--bg-panel); border-top: 2px solid var(--border); padding: 15px;
    display: flex; justify-content: center; align-items: center; gap: 15px;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.6); position: relative; z-index: 30;
  }
  .flask {
    width: 45px; height: 60px; border: 2px solid var(--text-muted); border-radius: 5px 5px 20px 20px;
    display: flex; justify-content: center; align-items: center;
    font-family: 'Syncopate', sans-serif; font-weight: 700; font-size: 1rem; color: #fff;
    background: rgba(0,0,0,0.5); transition: all 0.3s; 
  }
  .flask.filled { border-color: var(--accent); background: rgba(0, 234, 255, 0.1); box-shadow: 0 0 15px var(--accent-glow); color: var(--accent); }

  .mix-btn {
    background: transparent; color: var(--accent); border: 2px solid var(--accent); 
    padding: 10px 20px; border-radius: 4px; font-family: 'Syncopate', sans-serif;
    font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: 0.2s;
  }
  .mix-btn:hover:not(:disabled) { background: var(--accent); color: #000; }
  .mix-btn:disabled { border-color: #333; color: #333; cursor: not-allowed; }

  .result-text { font-family: 'Syncopate', sans-serif; font-size: 0.9rem; font-weight: 700; color: var(--accent); min-width: 120px; text-align: center;}
  #flash { position: fixed; top:0; left:0; width:100%; height:100%; background:var(--accent); opacity:0; pointer-events:none; z-index:100; transition: opacity 0.15s; }
  #loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--accent); font-family: 'Syncopate', sans-serif; font-weight: bold; font-size: 1.2rem; z-index: 100;}

  /* Медиа-запрос: на компьютере показываем сетку, скрываем список */
  @media (min-width: 850px) {
    h1 { font-size: 2.5rem; }
    .mobile-list { display: none; }
    .desktop-table { display: grid; }
    .flask { width: 60px; height: 80px; font-size: 1.2rem; }
    .lab-panel { padding: 20px; gap: 30px; }
    .mix-btn { padding: 12px 30px; font-size: 1rem; }
    .result-text { font-size: 1.1rem; min-width: 200px; }
  }
</style>
</head>
<body>

<header>
  <h1>ЛАБОРАТОРИЯ</h1>
  <p>Нажмите на элемент для получения данных. Выберите два для синтеза.</p>
</header>

<div id="loader">ИНИЦИАЛИЗАЦИЯ...</div>

<div class="table-container">
  <!-- Сетка для ПК -->
  <div class="desktop-table" id="desktop-table"></div>
  <!-- Список для телефона -->
  <div class="mobile-list" id="mobile-list"></div>
</div>

<!-- Модальное окно -->
<div id="modal-overlay" onclick="closeModal(event)">
  <div class="element-modal" onclick="event.stopPropagation()">
    <div class="close-modal" onclick="closeModal(event)">×</div>
    <div class="modal-header">
      <div class="modal-symbol" id="m-symbol">H</div>
      <div class="modal-title">
        <h2 id="m-name">Водород</h2>
        <p>Элемент №<span id="m-num">1</span></p>
      </div>
    </div>
    <div class="modal-info">
      <div class="info-box">
        <span>Атомный вес</span>
        <strong id="m-weight">1.008</strong>
      </div>
      <div class="info-box">
        <span>Группа / Период</span>
        <strong><span id="m-group">1</span> / <span id="m-period">1</span></strong>
      </div>
    </div>
    <div class="modal-desc" id="m-desc">Описание элемента...</div>
    
    <!-- Кнопка добавления в лабораторию из карточки -->
    <button class="btn-synth" id="modal-add-btn" onclick="addToLabFromModal()">ДОБАВИТЬ В СИНТЕЗ</button>
  </div>
</div>

<div class="lab-panel">
  <div class="flask" id="flask1">?</div>
  <button class="mix-btn" id="mix-btn" onclick="mixElements()" disabled>СИНТЕЗ</button>
  <div class="flask" id="flask2">?</div>
  <div class="result-text" id="result">...</div>
</div>

<div id="flash"></div>

<script>
const TABLE_ID = "1Dov5UEqtbvFSiCtkswwLi4l6GRYwARy2lV8xqYSedRg";
const CSV_ELEMENTS = `https://docs.google.com/spreadsheets/d/${TABLE_ID}/export?format=csv&gid=0`;
const CSV_REACTIONS = `https://docs.google.com/spreadsheets/d/${TABLE_ID}/export?format=csv&sheet=Реакции`;

let elementsData = [];
let reactionsData = [];
let selectedForLab = [];
let currentModalElement = null;

async function loadData() {
  try {
    const resEl = await fetch(CSV_ELEMENTS);
    const csvEl = await resEl.text();
    const rowsEl = parseCSV(csvEl);
    
    const hEl = rowsEl[0].map(h => h.trim().toLowerCase());
    const idxSym = hEl.indexOf('символ');
    const idxName = hEl.indexOf('название');
    const idxNum = hEl.indexOf('номер');
    const idxGroup = hEl.indexOf('группа');
    const idxPeriod = hEl.indexOf('период');
    const idxColor = hEl.indexOf('цвет');
    const idxWeight = hEl.indexOf('вес');
    const idxDesc = hEl.indexOf('описание');

    elementsData = rowsEl.slice(1).filter(r => r[idxSym]).map(r => ({
      sym: r[idxSym].trim(),
      name: r[idxName] ? r[idxName].trim() : "",
      num: parseInt(r[idxNum]) || 0,
      group: parseInt(r[idxGroup]) || 0,
      period: parseInt(r[idxPeriod]) || 0,
      color: r[idxColor] ? r[idxColor].trim() : "#00EAFF",
      weight: idxWeight !== -1 ? r[idxWeight] : "—",
      desc: idxDesc !== -1 ? r[idxDesc] : "Описание пока не добавлено."
    }));

    try {
      const resRe = await fetch(CSV_REACTIONS);
      const csvRe = await resRe.text();
      const rowsRe = parseCSV(csvRe);
      const hRe = rowsRe[0].map(h => h.trim().toLowerCase());
      const idxE1 = hRe.indexOf('элемент 1');
      const idxE2 = hRe.indexOf('элемент 2');
      const idxRes = hRe.indexOf('результат');

      if (idxE1 !== -1) {
        reactionsData = rowsRe.slice(1).filter(r => r[idxE1]).map(r => ({
          el1: r[idxE1].trim(),
          el2: r[idxE2] ? r[idxE2].trim() : "",
          result: r[idxRes] ? r[idxRes].trim() : "Неизвестное соединение"
        }));
      }
    } catch(e) { console.log("Ошибка загрузки реакций"); }

    initUI();
  } catch (error) {
    document.getElementById('loader').innerText = "ОШИБКА ДОСТУПА К БАЗЕ ДАННЫХ";
  }
}

function parseCSV(text) {
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (c === '"') inQuotes = false;
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c !== '\r') field += c;
    }
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function initUI() {
  document.getElementById('loader').style.display = 'none';
  renderDesktopTable();
  renderMobileList();
}

// --- ОТРИСОВКА ДЛЯ ПК (СЕТКА) ---
function renderDesktopTable() {
  const table = document.getElementById('desktop-table');
  for (let p = 1; p <= 7; p++) {
    for (let g = 1; g <= 18; g++) {
      const elData = elementsData.find(e => e.group === g && e.period === p);
      if (elData) {
        const el = document.createElement('div');
        el.className = 'element';
        el.style.gridColumn = g;
        el.style.gridRow = p;
        el.style.setProperty('--el-color', elData.color);
        el.innerHTML = `
          <div class="number">${elData.num}</div>
          <div class="symbol">${elData.sym}</div>
        `;
        el.onclick = () => openModal(elData);
        table.appendChild(el);
      }
    }
  }
}

// --- ОТРИСОВКА ДЛЯ ТЕЛЕФОНА (СПИСОК) ---
function renderMobileList() {
  const list = document.getElementById('mobile-list');
  // Сортируем по номеру
  const sorted = [...elementsData].sort((a, b) => a.num - b.num);
  
  list.innerHTML = sorted.map(elData => `
    <div class="mobile-item" style="--el-color: ${elData.color};" onclick="openModalBySym('${elData.sym}')">
      <div class="num">${elData.num}</div>
      <div class="sym" style="color: ${elData.color};">${elData.sym}</div>
      <div class="name">${elData.name}</div>
      <div class="arrow">→</div>
    </div>
  `).join('');
}

// --- МОДАЛЬНОЕ ОКНО ---
function openModal(data) {
  currentModalElement = data;
  document.getElementById('m-symbol').innerText = data.sym;
  document.getElementById('m-name').innerText = data.name;
  document.getElementById('m-num').innerText = data.num;
  document.getElementById('m-weight').innerText = data.weight;
  document.getElementById('m-group').innerText = data.group;
  document.getElementById('m-period').innerText = data.period;
  document.getElementById('m-desc').innerText = data.desc;
  
  document.getElementById('modal-overlay').classList.add('active');
}

function openModalBySym(sym) {
  const elData = elementsData.find(e => e.sym === sym);
  if (elData) openModal(elData);
}

function closeModal(event) {
  if (event.target.id === 'modal-overlay' || event.target.className === 'close-modal') {
    document.getElementById('modal-overlay').classList.remove('active');
  }
}

// Добавление в синтез из карточки
function addToLabFromModal() {
  if (!currentModalElement) return;
  if (selectedForLab.length >= 2) {
    selectedForLab = []; // Сбрасываем, если уже 2
  }
  if (selectedForLab.includes(currentModalElement.sym)) return;
  
  selectedForLab.push(currentModalElement.sym);
  updateLabUI();
  closeModal({ target: { id: 'modal-overlay' } });
}

function updateLabUI() {
  const flask1 = document.getElementById('flask1');
  const flask2 = document.getElementById('flask2');
  const mixBtn = document.getElementById('mix-btn');
  const result = document.getElementById('result');

  flask1.innerText = selectedForLab[0] || '?';
  flask2.innerText = selectedForLab[1] || '?';
  flask1.className = selectedForLab[0] ? 'flask filled' : 'flask';
  flask2.className = selectedForLab[1] ? 'flask filled' : 'flask';
  
  mixBtn.disabled = selectedForLab.length !== 2;
  result.innerText = '...';
  result.style.color = 'var(--accent)';
}

function mixElements() {
  if (selectedForLab.length !== 2) return;
  const el1 = selectedForLab[0];
  const el2 = selectedForLab[1];
  const resultEl = document.getElementById('result');
  const flash = document.getElementById('flash');

  const reaction = reactionsData.find(r => 
    (r.el1 === el1 && r.el2 === el2) || (r.el1 === el2 && r.el2 === el1)
  );

  flash.style.opacity = '0.8';
  setTimeout(() => flash.style.opacity = '0', 150);

  if (reaction) {
    resultEl.innerText = reaction.result;
    resultEl.style.color = 'var(--accent)';
    setTimeout(() => { selectedForLab = []; updateLabUI(); }, 3000);
  } else {
    resultEl.innerText = "НЕТ РЕАКЦИИ";
    resultEl.style.color = "#FF0055";
    setTimeout(() => { selectedForLab = []; updateLabUI(); }, 2000);
  }
}

loadData();
</script>
</body>
</html>
